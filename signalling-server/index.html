<!DOCTYPE html>
<html>

<head>
  <title>Realtime communication with WebRTC</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

  <h1>Realtime communication with WebRTC</h1>

  <div style="display: flex; align-items: flex-start;">

    <!-- Buttons Section -->
    <div id="buttons" style="display: flex; flex-direction: column; margin-right: 20px;">
      <button id="startDataButton">Start Data</button>
      <button id="sendDataButton">Send Data</button>
      <button id="startVideoButton">Start Video</button>
      <button id="addRemoteStreamButton">Add Remote Stream</button>
      <button id="closeButton">Stop</button>

      <!-- D-Pad Button Section -->
      <div id="dpad" style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
        <button id="forwardButton" style="margin-bottom: 10px;">Forward</button>
        <div style="display: flex; justify-content: space-between; width: 120px;">
          <button id="leftButton">Rotate Left</button>
          <button id="rightButton">Rotate Right</button>
        </div>
        <button id="backwardButton" style="margin-top: 10px;">Backward</button>
      </div>
    </div>

    <!-- Video Streams Section -->
    <div style="display: flex; flex-direction: column;">
      <!--video id="localVideo" autoplay playsinline style="width: 640px; height: 480px; margin-bottom: 10px;"></video-->
      <video id="remoteVideo" autoplay playsinline style="width: 320px; height: 240px;"></video>
      <textarea id="dataChannelSend" disabled placeholder="Press Start Data, enter some text, then press Send Data."></textarea>
      <textarea id="dataChannelReceive" disabled></textarea>
    </div>

  </div>

  <!-- This file is automatically added/served when running "node index.js". -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
