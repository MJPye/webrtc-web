<!DOCTYPE html>
<html>

<head>
  <title>Realtime communication with WebRTC</title>
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>

  <h1>Realtime communication with WebRTC</h1>

  <!-- Container for buttons and video -->
  <div class="container">
    <!-- Buttons Section -->
    <div id="buttons">
      <button id="startDataButton">Start Data</button>
      <button id="sendDataButton">Send Data</button>
      <button id="startVideoButton">Start Video</button>
      <button id="addRemoteStreamButton">Add Remote Stream</button>
      <button id="closeButton">Stop</button>
      <!-- HTML for the slider -->
      <label for="keyboardControlSlider">Enable Keyboard Control:</label>
      <input type="checkbox" id="keyboardControlSlider" />
    </div>

    <!-- Video Streams Section -->
    <div>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <!-- D-Pad Button Section -->
  <div class="dpad-buttons" id="dpad">
    <button id="forwardButton">Forward</button>
    <div>
      <button id="leftButton">Rotate Left</button>
      <button id="rightButton">Rotate Right</button>
    </div>
    <button id="backwardButton">Backward</button>
  </div>

  <!-- Text Areas Section -->
  <div id="text-send-receive">
    <textarea id="dataChannelSend" disabled placeholder="Press Start Data, enter some text, then press Send Data."></textarea>
    <textarea id="dataChannelReceive" disabled></textarea>
  </div>

  <!-- This file is automatically added/served when running "node index.js". -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script type="module" src="js/main.js"></script>

</body>

</html>
